# Career-Ops — Canonical States
# Source of truth for career-ops (writer) and dashboard (reader).
# Both systems MUST use these exact states.
#
# Rule: The status field in applications.md must contain EXACTLY
# one of these values (case-insensitive). No markdown bold (**),
# no dates, no extra text. Dates go in the date column.
#
# `terminal: true` marks a state with no further one-way lifecycle order
# among the other terminal states (they still supersede any non-terminal,
# earlier-stage state). States without a `terminal` key are treated as
# non-terminal and ordered by their position in this list. Consumed by
# tracker-sync-check.mjs's compareLifecycle() (issue #1504) so a new state
# added here can't silently fall through as "unrecognized."

states:
  - id: evaluated
    label: Evaluated
    aliases: [evaluada, condicional, hold, evaluar, verificar, değerlendirildi, degerlendirildi]
    description: Offer evaluated with report, pending decision (legacy — see interested)
    dashboard_group: evaluated

  # interested / ready_to_apply / application_skipped added 2026-09-13 (the
  # "Sorting Desk" lifecycle redesign). `interested` is the new default landing
  # state for a completed evaluation going forward — it occupies the same
  # lifecycle stage `evaluated` always has (report written, decision pending),
  # right after it in this list on purpose. Existing rows already marked
  # `evaluated` are left alone; nothing migrates them automatically.
  - id: interested
    label: Interested
    aliases: []
    description: Full evaluation (manual or automatic) confirmed this clears the bar; decision pending
    dashboard_group: interested

  - id: ready_to_apply
    label: Ready to Apply
    aliases: []
    description: Decided to apply, from Interested; application not sent yet
    dashboard_group: ready_to_apply

  - id: applied
    label: Applied
    aliases: [aplicado, enviada, aplicada, sent, başvuruldu, basvuruldu]
    description: Application submitted
    dashboard_group: applied

  - id: responded
    label: Responded
    aliases: [respondido, "yanıt verildi", yanıt_verildi, "yanit verildi", yanit_verildi]
    description: Company has responded (not yet interview)
    dashboard_group: responded

  - id: interview
    label: Interview
    aliases: [entrevista, mülakat, mulakat]
    description: Active interview process
    dashboard_group: interview

  - id: offer
    label: Offer
    aliases: [oferta, teklif]
    description: Offer received
    dashboard_group: offer
    terminal: true

  - id: rejected
    label: Rejected
    aliases: [rechazado, rechazada, reddedildi]
    description: Rejected by company
    dashboard_group: rejected
    terminal: true

  - id: discarded
    label: Discarded
    aliases: [descartado, descartada, cerrada, cancelada, "iptal edildi", iptal_edildi, "ıptal edildi", ıptal_edildi]
    description: Discarded by candidate or offer closed
    dashboard_group: discarded
    terminal: true

  - id: skip
    label: SKIP
    aliases: [no_aplicar, no aplicar, skip, monitor, geo blocker, geo_blocker, "uygun değil", uygun_değil, "uygun degil", uygun_degil]
    description: Doesn't fit, don't apply
    dashboard_group: skip
    terminal: true

  # Distinct from `discarded` (which also covers "offer closed") and from
  # `skip` (a pre-evaluation "doesn't fit"): this is specifically "the user
  # reviewed it — from Unreviewed directly, or after a full evaluation — and
  # decided not to apply." Reachable from #1 Unreviewed, #2 Interested, or #3
  # Ready to Apply (changed mind). It is a person's decision, never an
  # evaluation's verdict — see `below_the_bar` for that. Terminal — nothing
  # routes out of it automatically; moving a job back out is a manual,
  # explicit request, never an automated one.
  - id: application_skipped
    label: Application Skipped
    aliases: []
    description: The user reviewed it and decided not to apply (from Unreviewed or Interested)
    dashboard_group: application_skipped
    terminal: true

  # #5 in the Sorting Desk lifecycle (added 2026-09-18). A full A–G evaluation
  # scored the posting below the apply bar, so it stays tracked (a repost can
  # never look unreviewed again) but no decision was ever the user's to make.
  # Kept apart from `application_skipped` on purpose: #4 means "the user chose
  # not to apply", #5 means "the evaluation ruled it out". Only the full-eval
  # threshold decision writes this state; nobody picks it on the Desk. Terminal.
  - id: below_the_bar
    label: Below the Bar
    aliases: [below-the-bar, below_the_bar, below bar]
    description: Full evaluation scored below the apply bar — ruled out by the evaluation, not by a decision
    dashboard_group: below_the_bar
    terminal: true

  - id: hired
    label: Hired
    aliases: [contratado, contratada, hired, accepted, accept, "kabul edildi", kabul_edildi, "işe alındı", "ise alindi", "işe alindi"]
    description: Offer accepted, job landed!
    dashboard_group: hired
    terminal: true
